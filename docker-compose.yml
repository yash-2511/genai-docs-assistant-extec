services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/app/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app/data/uploads:/app/app/data/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:80"
