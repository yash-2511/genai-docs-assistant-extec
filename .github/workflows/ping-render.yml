name: Ping Render Health

on:
  schedule:
    # run every 8 minutes (UTC)
    - cron: '*/8 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      RENDER_URL: ${{ secrets.RENDER_URL }}
    steps:
      - name: Ping Render /health
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "RENDER_URL not set. Add repository secret named RENDER_URL." >&2
            exit 1
          fi
          echo "Pinging $RENDER_URL/health"
          status=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 20 "$RENDER_URL/health" || echo "000")
          echo "HTTP status: $status"
          if [ "$status" -eq 200 ]; then
            echo "OK"
          else
            echo "Non-200 response from health endpoint"
            # don't fail the workflow so transient errors don't spam alerts
          fi
